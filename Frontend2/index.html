<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ContactMate</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-900 dark:text-white min-h-screen">
    <!-- Loading -->
    <div id="loading" class="fixed inset-0 bg-black bg-opacity-30 hidden flex items-center justify-center z-50">
        <div class="w-8 h-8 border-4 border-t-blue-500 rounded-full animate-spin"></div>
    </div>

    <!-- Header -->
    <header class="bg-blue-600 text-white shadow sticky top-0 z-40">
        <div class="container mx-auto px-4 py-3 flex items-center justify-between">
            <h1 class="text-lg font-bold">ContactMate</h1>
            <button id="menuToggle" class="sm:hidden">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-width="2" d="M4 6h16M4 12h16h16M4 18h16"></path>
                </svg>

            </button>
            <nav id="navMenu" class="hidden sm:flex gap-3">
                <button class="navBtn" onclick="showSection('home')">Home</button>
                <button id="navContacts" class="navBtn hidden" onclick="showSection('contacts')('contacts')">Contacts</button>
                <button id="navAdmin" class="navBtn hidden" onclick="showSection('admin')('roles')">Roles</button>
            </nav>

            <div class="flex items-center gap-2">
                <div id="userInfo" class="hidden flex items-center gap-2">
                    <span id="userName"></span>
                    <button id="logout" class="bg-red-500 text-white px-2 py-1 rounded-sm text-sm hover:bg-red-600">Logout</button>
                </div>
                <button id="themeBtn" aria-label="Toggle Theme">
                    <svg id="themeIcon" class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M12 3v1m0 16v1m9-9h9m-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>
                    </svg>
                </button>
            </div>
        </div>
        <div id="mobileMenu" class="hidden sm:hidden bg-blue-700 p-2">
            <button class="menuBtn" onclick="showSection('home')">Home</button>
            <button id="navContactsMobile" class="menuBtn hidden" onclick="showSection('contacts')">Contacts</button>
            <button id="navAdminMobile" class="hidden menuBtn" onclick="showSection('admin')">Admin</button>
            <button id="navRolesMobile" class="hidden menuBtn" onclick="showSection('roles')">Roles</button>
        </div>

    </header>

    <!-- Main -->
    <main class="container mx-auto px-4 py-6">
        <!-- Auth -->
        <section id="authSection" class="max-w-sm mx-auto bg-white dark:bg-gray-800 p-4 rounded shadow">
            <h2 id="authTitle" class="text-lg font-semibold text-center mb-3">Sign In</h2>
            <form id="authForm" class="space-y-2">
                <div id="signUpFields" class="hidden space-y-2">
                    <input id="firstName" type="text" placeholder="First Name" class="off" class="w-full p-2 border rounded dark:bg-gray-700">
                    <input id="lastName" type="text" placeholder="Last Name" class="p-2 w-full p-2 border rounded-md" autocomplete="off" class="w-full">
                    <input id="email" type="email" placeholder="Email" class="p-2 w-full p-2 border rounded dark:bg-gray-700" autocomplete="off">
                    <input id="phone" type="tel" placeholder="Phone Number" class="w-full p-auto2 border rounded dark:bg-gray-700" autocomplete="off">
                </div>
                <input id="userName" type="text" placeholder="Username" class="w-full p-2 border rounded dark:bg-gray-700" autocomplete="off">
                <div class="relative">
                    <input id="password" type="password" placeholder="Password" class="w-full p-2 border rounded dark:bg-gray-700 pr-8">
                    <button id="togglePass" type="button" class="absolute right-2 top-2.5">
                        <svg id="eyeIcon" class="w-4 h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0zm6.627 0c-1.297 2.246-3.92 4-9.627 4-5.707 0-8.33-1.754-9.627-4 1.297-2.246 3.92-4 9.627-4 5.707 0 8.33 1.754 9.627 4z"></path>
                        </svg>
                    </button>
                </div>
                <button id="authSubmit" type="submit" class="w-full bg-blue-600 text-white p-2 rounded hover:bg-blue-700">Sign In</button>
            </form>
            <button id="toggleAuth" class="mt-2 w-full text-blue-600 dark:text-blue-400 text-sm hover:underline">Switch to Sign Up</button>
        </section>

        <!-- Home -->
        <section id="homeSection" class="hidden">
            <div class="bg-white dark:bg-gray-800 p-4 rounded shadow">
                <h2 class="text-lg font-semibold mb-3">Profile</h2>
                <div id="userProfile" class="text-sm space-y-1"></div>
            </div>
        </section>

        <!-- Contacts -->
        <section id="contactsSection" class="hidden">
            <div class="bg-white dark:bg-gray-800 p-4 rounded shadow">
                <h2 class="text-lg font-semibold mb-3">Contacts</h2>
                <form id="contactForm" class="space-y-2 mb-4">
                    <input id="contactId" type="hidden">
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                        <input id="contactFirstName" type="text" placeholder="First Name" class="p-2 border rounded dark:bg-gray-700">
                        <input id="contactLastName" type="text" placeholder="Last Name" class="p-2 border rounded dark:bg-gray-700">
                        <input id="contactEmail" type="email" placeholder="Email" class="p-2 border rounded dark:bg-gray-700">
                        <input id="contactPhone" type="tel" placeholder="Phone Number" class="p-2 border rounded dark:bg-gray-700">
                        <input id="contactAddress" type="text" placeholder="Address" class="sm:col-span-2 p-2 border rounded dark:bg-gray-700">
                    </div>
                    <div class="flex gap-2">
                        <button id="contactSubmit" type="submit" class="flex-1 bg-blue-600 text-white p-2 rounded hover:bg-blue-700">Add</button>
                        <button id="contactReset" type="button" class="flex-1 bg-gray-500 text-white p-2 rounded hover:bg-gray-600">Reset</button>
                    </div>
                </form>
                <div class="flex flex-col sm:flex-row gap-2 mb-4">
                    <input id="contactSearch" type="text" placeholder="Search..." class="flex-1 p-2 border rounded dark:bg-gray-700">
                    <select id="contactSort" class="p-2 border rounded dark:bg-gray-700">
                        <option value="name-asc">Name (A-Z)</option>
                        <option value="name-desc">Name (Z-A)</option>
                        <option value="email-asc">Email (A-Z)</option>
                        <option value="email-desc">Email (Z-A)</option>
                    </select>
                    <button id="exportCsv" class="bg-green-600 text-white p-2 rounded hover:bg-green-700">Export CSV</button>
                </div>
                <div id="contactList"></div>
                <div class="flex justify-between mt-4">
                    <button id="prevPage" class="bg-gray-500 text-white p-2 rounded hover:bg-gray-600" disabled>Prev</button>
                    <span id="pageInfo" class="text-sm"></span>
                    <button id="nextPage" class="bg-blue-600 text-white p-2 rounded hover:bg-blue-700">Next</button>
                </div>
                <button id="bulkDelete" class="mt-2 bg-red-600 text-white p-2 rounded hover:bg-red-700 hidden">Delete Selected</button>
            </div>
        </section>

        <!-- Admin -->
        <section id="adminSection" class="hidden">
            <div class="bg-white dark:bg-gray-800 p-4 rounded shadow">
                <h2 class="text-lg font-semibold mb-3">Admin</h2>
                <div class="space-y-4">
                    <div>
                        <h3 class="text-sm font-medium mb-2">Users by Role</h3>
                        <div class="flex gap-2">
                            <input id="roleFilter" type="text" placeholder="Role" class="flex-1 p-2 border rounded dark:bg-gray-700">
                            <button id="getUsers" class="bg-blue-600 text-white p-2 rounded hover:bg-blue-700">Get</button>
                        </div>
                        <div id="userList" class="mt-2"></div>
                    </div>
                    <div>
                        <h3 class="text-sm font-medium mb-2">Change Role</h3>
                        <div class="flex gap-2">
                            <input id="changeUserId" type="text" placeholder="User ID" class="flex-1 p-2 border rounded dark:bg-gray-700">
                            <input id="changeRoleId" type="text" placeholder="Role ID" class="flex-1 p-2 border rounded dark:bg-gray-700">
                            <button id="changeRole" class="bg-blue-600 text-white p-2 rounded hover:bg-blue-700">Change</button>
                        </div>
                    </div>
                    <div>
                        <h3 class="text-sm font-medium mb-2">Delete User</h3>
                        <div class="flex gap-2">
                            <input id="deleteUserId" type="text" placeholder="User ID" class="flex-1 p-2 border rounded dark:bg-gray-700">
                            <button id="deleteUser" class="bg-red-600 text-white p-2 rounded hover:bg-red-700">Delete</button>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- Roles -->
        <section id="rolesSection" class="hidden">
            <div class="bg-white dark:bg-gray-800 p-4 rounded shadow">
                <h2 class="text-lg font-semibold mb-3">Roles</h2>
                <form id="roleForm" class="space-y-2 mb-4">
                    <input id="roleName" type="text" placeholder="Role Name" class="w-full p-2 border rounded dark:bg-gray-700">
                    <input id="roleDesc" type="text" placeholder="Description" class="w-full p-2 border rounded dark:bg-gray-700">
                    <button type="submit" class="w-full bg-blue-600 text-white p-2 rounded hover:bg-blue-700">Create</button>
                </form>
                <div id="roleList"></div>
            </div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
